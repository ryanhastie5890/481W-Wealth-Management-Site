<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Login | Wealth Management</title>
  <link rel="shortcut icon" href="#">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #9eb5b3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      text-align: center;
    }
    .container form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container input {
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .container .form-label {
      display: none;
    }
  </style>
</head>
<body>
    <h1 style="color:white">XYZ Investments Platform</h1>
  <div class="container">
    <h2>Register</h2>
    <form action="/api/auth/register" method="POST">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control w-25" id="exampleInputEmail1" aria-describedby="emailHelp" name="email" placeholder="Email" required>
      <br>
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input type="password" class="form-control w-25" id="exampleInputPassword1" name="password" placeholder="Password" required>
      <br>
      <button type="submit">Register</button>
    </form>

    <hr>

    <h2>Login</h2>

    <!-- Login form now uses JS to allow for 2FA popup -->
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" required>
      <br>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <br>
      <button type="submit">Login</button>
    </form>

    <p id="message" style="color:red;"></p>
  </div>

  <!-- 2FA popup modal -->
  <div id="twoFAmodal" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
  ">
    <div style="
      background:white;
      padding:20px;
      width:300px;
      margin:150px auto;
      border-radius:8px;
      position:relative;
    ">
      <button id="close2FA" style="
        position:absolute;
        top:5px;
        right:10px;
        background:none;
        border:none;
        font-size:20px;
        cursor:pointer;
      ">&times;</button>

      <h3>Two-Factor Authentication</h3>
      <p>Enter the 6-digit code sent to your email.</p>

      <input id="twoFAcode" maxlength="6" placeholder="123456">

      <button id="verify2FA" style="margin-top:10px;">Verify</button>

      <p id="twoFAerror" style="color:red; margin-top:10px;"></p>
    </div>
  </div>

  <script>
    // LOGIN HANDLER
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = "/index.html";
        return;
      }

      if (data.requires2FA) {
        document.getElementById("twoFAmodal").style.display = "block";
        return;
      }

      document.getElementById("message").innerText = data.error || "Login failed";
    });

    // 2FA VERIFY HANDLER
    document.getElementById("verify2FA").addEventListener("click", async () => {
      const code = document.getElementById("twoFAcode").value;

      const res = await fetch("/api/auth/verify-2fa", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = "/index.html";
      } else {
        document.getElementById("twoFAerror").innerText = data.message || "Invalid code";
      }
    });

    document.getElementById("close2FA").addEventListener("click", () => {
      document.getElementById("twoFAmodal").style.display = "none";
    });
  </script>
</body>
</html>
